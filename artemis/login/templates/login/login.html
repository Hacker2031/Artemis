{% load static %}
<!DOCTYPE html>
<html lang="PT-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Ártemis - Corporativo</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Sharp" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">

    <link rel="shortcut icon" href="" type="image/x-icon">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-dark: #201c3d;
            --sidebar-bg: #1a1635;
            --card-bg: #2d2654;
            --accent-blue: #5d87ff;
            --text-main: #ffffff;
            --text-dim: #b2b1c5;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }

        body {
            background: var(--bg-dark);
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
        }

        /* --- ESTILOS TELA DE LOGIN --- */
        #login-page {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(rgba(0, 50, 100, 0.6), rgba(0, 20, 40, 0.8)), 
                        url(' {% static "images/Foto Stock Cybersecurity concept, digital padlock over abstract background, neon blue colours.jpg"%} ') no-repeat center center;
            background-size: cover;
            position: fixed;
            width: 100%;
            z-index: 100;
            transition: transform 0.8s cubic-bezier(0.7, 0, 0.3, 1);
        }

        .login-container {
            width: 850px;
            height: 500px;
            display: flex;
            {% comment %} background: rgba(255, 255, 255, 0.85); {% endcomment %}
            backdrop-filter: blur(15px);
            border-radius: 40px;
            overflow: hidden;
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .brand-section {
            flex: 1;
            background: radial-gradient(circle at center, #1a4a8d 0%, #05162e 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            text-align: center;
            border-top-right-radius: 150px;
            border-bottom-right-radius: 50px;
        }

    .logo-circle {
    width: 170px;
    height: 170px;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    background-color: #ffffff00;
    align-items: center;
    {% comment %} backdrop-filter: blur(15px); {% endcomment %}

  

    overflow: hidden;
    padding: 20px; 
}

  .form-section {
            flex: 1.2; padding: 50px;
            display: flex; flex-direction: column; justify-content: center;
            color: #1a2a40;
            align-items: center;
        }

        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 0.8rem; margin-bottom: 5px; }
        .input-wrapper { position: relative; display: flex; align-items: center; width: 20rem;}
        .input-wrapper i { position: absolute; left: 15px; color: #3a7bd5;}
        .input-wrapper input {
            width: 100%; padding: 12px 15px 12px 45px;
            border: none; 
            background: #eef2f7; border-radius: 10px; outline: none;
        }


        /* .i{ 
            margin-right: 50rem;
            position: relative;
        } */

        .btn-entrar {
            background: linear-gradient(90deg, #3a7bd5 0%, #00d2ff 100%);
            color: white; border: none; padding: 15px;
            border-radius: 30px; font-weight: bold; cursor: pointer;
            margin-top: 20px; transition: 0.3s;
        }

        /* --- ESTILOS DASHBOARD --- */
        #dashboard-page {
            display: flex;
            height: 100vh;
            opacity: 0;
            transition: opacity 1s ease;
        }

        .sidebar { width: 240px; background: var(--sidebar-bg); padding: 25px; }
        .nav-item {
            display: flex; align-items: center; gap: 12px;
            padding: 12px; border-radius: 8px; color: var(--text-dim);
            text-decoration: none; margin-bottom: 8px;
        }
        .nav-item.active { background: var(--accent-blue); color: white; }

        .main-content { flex: 1; padding: 30px; overflow-y: auto; }
        .dashboard-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
        .card { background: var(--card-bg); border-radius: 15px; padding: 20px; }
        .card-val { font-size: 1.8rem; font-weight: bold; margin: 10px 0; }
        canvas { max-height: 120px !important; }

        /* Classe para esconder login */
        .hide-login { transform: translateY(-100%); }
        .show-dash { opacity: 1 !important; }



    .input-wrapper span {
    position: absolute;
    right: 15px;
    top: 50%;
    transform: translateY(-50%);
    color:#152439;
    font-size: 20px;
    opacity: 0.8;
}


.input-wrapper input::placeholder {
    color: rgba(62, 59, 59, 0.7);
    text-align: left;
}

        .btn-entrar {
    width: 50%;
    padding: 16px;
    border-radius: 30px;
    font-weight: bold;
    font-size: 1rem;
    border: none;
    cursor: pointer;
    margin-top: 25px;

    background: linear-gradient(90deg, #3a7bd5 0%, #00d2ff 100%);
    color: white;

    transition: 0.3s;
}

.btn-entrar:hover {
    transform: scale(1.03);
    box-shadow: 0 10px 25px rgba(0, 210, 255, 0.5);
}

.imagem { 
    width: 250%;
    height: 250%;
    object-fit: contain;
    filter: drop-shadow(0 0 10px rgba(255,255,255,0.3));
    margin-top: 58px;
}
    
    </style>
</head>
<body>

    <section id="login-page">
        <div class="login-container">
            <div class="brand-section">
                <div class="logo-circle"> 
                    
                    <img class="imagem" src=" {% static "images/artemis_sem_fundo_1.png" %} " alt="Artemis Logo">

                    <i class="fas fa-bullseye" style="font-size: 3rem; color: #4facfe;"></i></div>
                    <h1>ARTEMIS</h1>
                    <p style="font-size: 0.8rem; opacity: 0.7; margin-top: 10px;">Gestão Inteligente com Proteção de Dados.</p>
                </div>
            <div class="form-section">
                <h2 style="margin-bottom: 5px; color: white;">Entrar</h2>
            <form action="" method="POST"> 
                {% csrf_token %}
                
                <div class="input-group">
                    <label style="color: white;">Email</label>
                    <div class="input-wrapper">
                        <input type="email" placeholder="Nome de Utilizador" value="" name="username">
                         <span class="material-symbols-outlined">mail</span>
                    </div>
                </div>

                <div class="input-group">
                    <label style="color: white;">Senha de Acesso</label>
                    <div class="input-wrapper">
                        <input type="password" placeholder="Senha" value="" name="password">
                          <span class="material-symbols-outlined">lock</span>
                    </div>
                </div>

                <button class="btn-entrar" class="botao" type="submit">ENTRAR</button>
            </form>
            </div>
        </div>
    </section>

    {% for message in messages %}

        <script id="message"> alert("{{ message }}")</script>

    {% endfor %}

        
</body>
</html>
